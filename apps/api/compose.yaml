name: lumen-radar-api

services:
  postgres:
    image: postgres:17-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumen_radar}
      POSTGRES_DB: ${POSTGRES_DB:-lumen_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  api:
    build:
      context: .
      target: runtime
    init: true
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3051}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumen_radar}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-lumen_radar}
    ports:
      - "127.0.0.1:${PORT:-3051}:3051"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    stop_grace_period: 15s

  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    profiles: [umami]
    init: true
    restart: unless-stopped
    environment:
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DATABASE_URL: postgresql://umami:${UMAMI_POSTGRES_PASSWORD:-}@umami-db:5432/umami
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3054}:3000"
    networks:
      - default
      - umami_db
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  umami-db:
    image: postgres:17-bookworm
    profiles: [umami]
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:-}
    volumes:
      - umami_data:/var/lib/postgresql/data
    networks:
      - umami_db
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "umami", "-d", "umami"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  umami_db:
    internal: true

volumes:
  postgres_data:
  umami_data:

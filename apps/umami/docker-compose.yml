services:
  umami:
    build:
      context: .
      args:
        SKIP_BUILD_GEO: '1'
    init: true
    restart: always
    environment:
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in the API .env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumen_radar}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:${POSTGRES_PORT:-5431}/umami
    ports:
      - '127.0.0.1:${UMAMI_PORT:-3054}:3000'
    depends_on:
      umami-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/api/heartbeat']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 15s

  umami-db-init:
    image: postgres:17-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT:-5431}
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-lumen_radar}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - sh
      - -ec
      - |
        psql -X -v ON_ERROR_STOP=1 <<'SQL'
        SELECT 'CREATE DATABASE umami'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'umami')
        \gexec
        SQL

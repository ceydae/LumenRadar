version: "3.9"

services:
  docs:
    build:
      context: ./apps/docs
      dockerfile: Dockerfile
    container_name: lumen-radar-docs
    ports:
      - "3053:3053"
    environment:
      - NODE_ENV=production
      - PORT=3053
      - HOSTNAME=0.0.0.0
      # Cross-app links — override with real URLs in production
      - NEXT_PUBLIC_LANDING_URL=http://127.0.0.1:3050
      - NEXT_PUBLIC_DASHBOARD_URL=http://127.0.0.1:3051
    restart: unless-stopped
    networks:
      - lumen-radar

networks:
  lumen-radar:
    name: lumen-radar-network

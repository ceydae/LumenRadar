version: "3.9"

services:
  docs:
    build:
      context: ./apps/docs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://127.0.0.1:3052}
    container_name: lumen-radar-docs
    ports:
      - "3053:3053"
    environment:
      - NODE_ENV=production
      - PORT=3053
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - lumen-radar

networks:
  lumen-radar:
    name: lumen-radar-network
